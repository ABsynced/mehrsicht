# Runs the whole Mehrsicht pipeline every 6 hours and publishes the site
# on GitHub Pages. Repository secrets (Settings > Secrets and variables >
# Actions): GROQ_API_KEY and CEREBRAS_API_KEY (both free), optional FACTCHECK_API_KEY,
# NEWSLETTER_FORM_ACTION. Variables: SITE_URL, CONTACT_EMAIL, IMPRESSUM_NAME, IMPRESSUM_ADDRESS.
# Every 6 hours = 4 runs a day, which fits Groq's free daily limits.

name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours at minute 17 (UTC)
  workflow_dispatch:          # adds a "Run workflow" button on GitHub
  push:
    branches: [main]

permissions:
  contents: write   # only used to save the README screenshots in the branch "screenshots"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: groq,cerebras
      # Public website: only free Wikimedia photos, never press photos.
      IMAGE_SOURCE: commons
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
      NEWSLETTER_FORM_ACTION: ${{ secrets.NEWSLETTER_FORM_ACTION }}
      SITE_URL: ${{ vars.SITE_URL }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      IMPRESSUM_NAME: ${{ vars.IMPRESSUM_NAME }}
      IMPRESSUM_ADDRESS: ${{ vars.IMPRESSUM_ADDRESS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliotheken installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Keeps the 7-day story archive, photos and outlet logos between runs,
      # so stories keep their IDs and old analyses are reused (saves AI tokens).
      - name: Archiv wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            data/archive_*.json
            data/media
          key: mehrsicht-archive-${{ github.run_id }}
          restore-keys: mehrsicht-archive-

      - name: Tests
        run: python -m pytest -q

      - name: Nachrichten holen und analysieren
        # Without GROQ_API_KEY this still runs with real news, just without AI.
        run: python -m pipeline.run --edition all

      - name: Share-Kacheln erzeugen
        run: python -m sharecards.render

      - name: Website bauen
        run: python -m site_builder.build

      # Fresh screenshots of today's site for the README (site/screenshots/*.jpg)
      - name: Screenshots
        continue-on-error: true
        run: python -m site_builder.screenshots

      # The README shows these pictures. They live in their own branch
      # ("screenshots", always just one commit), so the main history stays clean.
      - name: Screenshots für die README speichern
        continue-on-error: true
        run: |
          cd site/screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots vom $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
