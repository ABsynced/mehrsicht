    name: The Guardian (Europa)
    country: GB
    lang: en
    rss: https://www.theguardian.com/world/europe-news/rss
    lean: -1
  - id: lemonde
    name: Le Monde
    country: FR
    lang: fr
    rss: https://www.lemonde.fr/rss/une.xml
    lean: -1
  - id: lefigaro
    name: Le Figaro
    country: FR
    lang: fr
    rss: https://www.lefigaro.fr/rss/figaro_actualites.xml
