    name: POLITICO Europe
    country: BE
    lang: en
    rss: https://www.politico.eu/feed/
    lean: 0
  - id: euronews
    name: Euronews
    country: FR
    lang: en
    rss: https://www.euronews.com/rss
    lean: 0
