# Nachrichtenquellen der Europa-Ausgabe.
# Gleiche Regeln wie sources_de.yaml: lean ist VORLÄUFIG und muss vor dem
# Start belegt werden. "country" ist der ISO-Ländercode, "lang" die Sprache
# der Schlagzeilen (die KI übersetzt Zusammenfassungen ins Deutsche).

edition: eu
sources:
