# Wem gehören die Medien? (Eigentümer-Kategorie pro Quelle)
#
# VORLÄUFIG – Stand Oktober 2026, aus öffentlich bekannten Angaben zusammengestellt.
# Vor der Veröffentlichung jede Zeile prüfen (Impressum / "Über uns" des Mediums,
# KEK-Mediendatenbank: https://www.kek-online.de/medienkonzentration/mediendatenbank).
#
# Kategorien (feste Liste, damit die Farben gleich bleiben):
categories:
  oeffentlich:    {name: Öffentlich-rechtlich,      color: "#0F766E", info: "Finanziert über den Rundfunkbeitrag, staatsfern organisiert."}
  konzern:        {name: Medienkonzern,             color: "#7C3AED", info: "Teil eines großen Medienunternehmens mit vielen Marken."}
  familie:        {name: Verlag in Familienbesitz,  color: "#B45309", info: "Verlag, der überwiegend einer Familie oder Privatperson gehört."}
  investor:       {name: Finanzinvestor,            color: "#BE123C", info: "Mehrheitlich im Besitz von Investoren oder Fonds."}
  stiftung:       {name: Stiftung / Trust,          color: "#1D4ED8", info: "Gehört einer Stiftung, die die Unabhängigkeit sichern soll."}
  genossenschaft: {name: Genossenschaft / Mitarbeiter, color: "#15803D", info: "Gehört Leserinnen, Lesern oder Mitarbeitenden."}
  ag:             {name: Aktiengesellschaft,        color: "#475569", info: "Börsen- oder Aktiengesellschaft mit vielen Anteilseignern."}

